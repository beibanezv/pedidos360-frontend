<div class="art" [style.background]="fondo">
  @switch (arte) {
    @case ('cuadro') {
      <svg viewBox="0 0 100 100" width="60%" height="60%">
        <rect x="20" y="20" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5" />
        <circle cx="50" cy="50" r="14" fill="var(--ink)" opacity="0.5" />
      </svg>
    }
    @case ('circulo') {
      <svg viewBox="0 0 100 100" width="60%" height="60%">
        <circle cx="50" cy="50" r="30" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5" />
        <circle cx="50" cy="50" r="6" fill="var(--ink)" />
      </svg>
    }
    @case ('triangulo') {
      <svg viewBox="0 0 100 100" width="60%" height="60%">
        <path d="M20 70 L50 20 L80 70 Z" fill="none" stroke="var(--paper)" stroke-width="2" opacity="0.4" />
      </svg>
    }
    @case ('amplificador') {
      <svg viewBox="0 0 100 100" width="60%" height="60%">
        <rect x="25" y="35" width="50" height="30" rx="2" fill="none" stroke="var(--copper)" stroke-width="2" opacity="0.5" />
        <circle cx="35" cy="50" r="5" fill="var(--copper)" />
        <circle cx="65" cy="50" r="5" fill="var(--copper)" />
      </svg>
    }
  }
</div>
<div class="vinyl-peek">
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <circle class="grooves" cx="50" cy="50" r="46" fill="var(--panel-2)" stroke="var(--hair)" />
    <circle cx="50" cy="50" r="16" [attr.fill]="acento" />
    <circle cx="50" cy="50" r="2" fill="var(--ink)" />
  </svg>
</div>
